name: Publish (manual)
on:
  workflow_dispatch:

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest SatSight web demo
        # SatSight (github.com/asvarga/SatSight) builds this on every push to
        # main and republishes it as the "web-latest" release asset. Pulling
        # it here (rather than committing it) keeps this repo free of binary
        # wasm blobs and always picks up whatever SatSight last published.
        run: |
          mkdir -p docs/site/satsight
          curl -fsSL -o /tmp/satsight-web.tar.gz \
            https://github.com/asvarga/SatSight/releases/download/web-latest/satsight-web.tar.gz
          tar -xzf /tmp/satsight-web.tar.gz -C docs/site/satsight

      - name: Deploy docs
        run: mkdocs gh-deploy --force
