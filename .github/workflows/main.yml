name: Publish
on:
  # Every push to main publishes; the button (or `deploy`) re-publishes on demand,
  # e.g. to pick up a newer SatSight demo.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push supersedes a queued one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check site
        # Broken links, drifted headers/footers or a stale feed stop the publish.
        run: python3 bin/check

      - name: Fetch latest SatSight web demo
        # SatSight (github.com/asvarga/SatSight) builds this on every push to
        # main and republishes it as the "web-latest" release asset. Pulling
        # it here (rather than committing it) keeps this repo free of binary
        # wasm blobs and always picks up whatever SatSight last published.
        run: |
          mkdir -p docs/site/satsight
          curl -fsSL -o /tmp/satsight-web.tar.gz \
            https://github.com/asvarga/SatSight/releases/download/web-latest/satsight-web.tar.gz
          tar -xzf /tmp/satsight-web.tar.gz -C docs/site/satsight

      - name: Stamp build info
        # Read by the footer's ⓘ (assets/site.js): which commit, published when.
        run: printf '{"commit":"%s","time":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/build.json

      - name: Publish docs/ to gh-pages
        # The site is plain HTML: docs/ is published exactly as committed.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
