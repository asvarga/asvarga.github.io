<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84">
  <!-- Div Jumper's frog: a crouched tree frog in profile, facing left. Feet sit on the bottom edge. -->
  <g stroke="#1f3a1c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- far hind leg, tucked behind the body -->
    <path d="M92 52 C104 52 112 62 106 72 C100 80 84 80 70 80 L62 82 L70 77 L58 78 L68 73 C80 72 92 70 94 64 Z" fill="#3e6634"/>
    <!-- body: snout at the left, rump at the right -->
    <path d="M10 46 C8 38 16 30 28 27 C34 22 44 21 50 25 C66 24 86 28 100 40 C110 49 108 62 98 68 C86 75 64 76 46 72 C32 70 18 62 12 54 Z" fill="#5b8a46"/>
    <!-- pale lower lip and belly -->
    <path d="M12 54 C22 60 34 66 50 68 C66 70 84 68 96 62 C88 72 66 74 48 71 C32 69 20 63 12 54 Z" fill="#cfdcae" stroke="none"/>
    <!-- near hind leg: thigh, shin folded under, long foot forward -->
    <path d="M78 46 C94 42 108 52 104 64 C100 72 88 74 78 72 C70 70 66 60 70 52 C72 49 75 47 78 46 Z" fill="#4f7a3c"/>
    <path d="M86 70 C80 76 66 78 52 78 L40 81 L50 76 L36 77 L48 72 L38 70 L52 70 C62 70 72 68 78 66 Z" fill="#4f7a3c"/>
    <!-- front leg -->
    <path d="M34 60 C36 66 34 72 30 76 L22 80 L30 79 L26 83 L33 79 L36 82 L38 77 C42 72 42 64 40 60 Z" fill="#4f7a3c"/>
    <!-- eye: raised socket, gold iris, horizontal pupil -->
    <circle cx="36" cy="28" r="9.5" fill="#5b8a46"/>
    <circle cx="35" cy="27.5" r="6.4" fill="#d6a429" stroke-width="1.6"/>
    <ellipse cx="35" cy="27.5" rx="4.4" ry="1.7" fill="#1f2a1a" stroke="none"/>
  </g>
  <!-- mouth line and a few dorsal markings -->
  <g fill="none" stroke="#1f3a1c" stroke-linecap="round">
    <path d="M11 47 C18 48.6 26 48.8 34 47.6" stroke-width="1.8"/>
    <path d="M56 32 C60 31 64 32 66 34" stroke-width="1.4" opacity="0.55"/>
    <path d="M72 35 C76 35 80 37 82 40" stroke-width="1.4" opacity="0.55"/>
  </g>
  <circle cx="18" cy="38" r="1.3" fill="#1f3a1c"/>
</svg>
