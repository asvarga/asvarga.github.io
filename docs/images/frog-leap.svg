<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84">
  <!-- Div Jumper's frog mid-leap, facing left: body stretched and tilted up, hind legs extended behind. -->
  <g stroke="#1f3a1c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- far hind leg, extended back and down -->
    <path d="M78 40 C88 44 98 52 106 60 L114 66 L108 64 L116 72 L106 67 L110 76 L101 66 C94 60 84 54 74 50 Z" fill="#3e6634"/>
    <!-- body, tilted nose-up -->
    <path d="M8 30 C8 22 16 16 28 15 C34 11 44 11 50 16 C64 18 80 26 88 38 C94 48 88 58 76 58 C62 58 44 54 30 48 C18 43 9 38 8 30 Z" fill="#5b8a46"/>
    <!-- pale lower lip and belly -->
    <path d="M9 36 C18 42 32 48 48 52 C62 55 76 56 84 52 C78 59 62 59 46 55 C30 51 16 45 9 36 Z" fill="#cfdcae" stroke="none"/>
    <!-- near hind leg: thigh, then shin and long foot trailing behind -->
    <path d="M66 36 C80 34 92 42 92 52 C92 58 84 60 76 58 C68 56 62 48 62 42 C62 39 64 37 66 36 Z" fill="#4f7a3c"/>
    <path d="M86 54 C94 60 102 66 108 72 L118 78 L110 77 L117 83 L106 78 L107 84 L100 76 C94 70 86 64 80 58 Z" fill="#4f7a3c"/>
    <!-- front legs reaching forward and down -->
    <path d="M26 44 C22 50 16 56 10 60 L3 62 L9 64 L4 68 L12 65 L12 70 L16 63 C22 58 30 52 33 47 Z" fill="#4f7a3c"/>
    <!-- eye: raised socket, gold iris, horizontal pupil -->
    <circle cx="34" cy="16" r="9.5" fill="#5b8a46"/>
    <circle cx="33" cy="15.5" r="6.4" fill="#d6a429" stroke-width="1.6"/>
    <ellipse cx="33" cy="15.5" rx="4.4" ry="1.7" fill="#1f2a1a" stroke="none"/>
  </g>
  <g fill="none" stroke="#1f3a1c" stroke-linecap="round">
    <path d="M9 31 C16 32.6 24 32.8 32 31.6" stroke-width="1.8"/>
    <path d="M54 21 C58 21 62 23 64 25" stroke-width="1.4" opacity="0.55"/>
    <path d="M68 27 C72 28 75 30 77 33" stroke-width="1.4" opacity="0.55"/>
  </g>
  <circle cx="16" cy="23" r="1.3" fill="#1f3a1c"/>
</svg>
